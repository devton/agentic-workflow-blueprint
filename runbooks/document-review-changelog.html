<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runbook: Document Review Changelog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-8">
  <main class="max-w-4xl mx-auto space-y-6">
    <section class="rounded-2xl border border-zinc-800 p-6" style="background: rgba(24,24,27,0.65); backdrop-filter: blur(12px);">
      <h1 class="text-3xl font-semibold">Runbook: Document -> Review -> Changelog</h1>
      <p class="mt-2 text-zinc-300">Execute a reliable documentation pipeline with bounded retries and clear handoff criteria.</p>
    </section>
    <section class="rounded-2xl border border-zinc-800 p-6" style="background: rgba(24,24,27,0.65); backdrop-filter: blur(12px);">
      <h2 class="text-xl font-semibold">Operational Evidence Checks</h2>
      <p class="mt-2 text-zinc-300">For infra, network, IaC, and OS changes, require verification logs, rollback status, and post-change health evidence before review pass.</p>
    </section>
  </main>
</body>
</html>
