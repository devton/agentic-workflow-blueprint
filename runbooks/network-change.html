<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runbook: Network Change</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-8">
  <main class="max-w-4xl mx-auto space-y-6">
    <section class="rounded-2xl border border-zinc-800 p-6" style="background: rgba(24,24,27,0.65); backdrop-filter: blur(12px);">
      <h1 class="text-3xl font-semibold">Runbook: Network Change</h1>
      <p class="mt-2 text-zinc-300">Controlled sequence for topology, routing, DNS, and firewall updates with rollback checkpoints.</p>
    </section>
    <section class="rounded-2xl border border-zinc-800 p-6" style="background: rgba(24,24,27,0.65); backdrop-filter: blur(12px);">
      <h2 class="text-xl font-semibold">Gate Status</h2>
      <div class="mt-3 flex gap-2 text-xs">
        <span class="px-2 py-1 rounded bg-emerald-500/20 text-emerald-300">Pre-checks required</span>
        <span class="px-2 py-1 rounded bg-sky-500/20 text-sky-300">Post-checks required</span>
        <span class="px-2 py-1 rounded bg-amber-500/20 text-amber-300">Rollback required</span>
      </div>
    </section>
  </main>
</body>
</html>
