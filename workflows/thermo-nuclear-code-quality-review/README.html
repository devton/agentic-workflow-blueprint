<!doctype html>
<html lang="en">
<head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen p-8">

    </section>

    <section class="rounded-2xl border border-zinc-800 p-6" style="background: rgba(24, 24, 27, 0.65); backdrop-filter: blur(12px);">
      <h2 class="text-xl font-semibold">Contract sections</h2>
      <p class="mt-2 text-zinc-300">The executable contract lives in <code>SKILL.md</code> with deterministic review gates.</p>
    </section>
