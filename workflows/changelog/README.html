<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow: changelog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-8">
  <main class="max-w-5xl mx-auto space-y-6">
    <section class="rounded-2xl border border-zinc-800 p-6" style="background: rgba(24, 24, 27, 0.65); backdrop-filter: blur(12px);">
      <h1 class="text-3xl font-semibold">changelog</h1>
      <p class="mt-2 text-zinc-300">Generate concise changelog entries from approved documentation changes.</p>
      <div class="mt-4 flex flex-wrap gap-2 text-xs">
        <span class="px-2 py-1 rounded bg-emerald-500/20 text-emerald-300">documentation</span>
        <span class="px-2 py-1 rounded bg-sky-500/20 text-sky-300">release notes</span>
        <span class="px-2 py-1 rounded bg-amber-500/20 text-amber-300">review-gated</span>
      </div>
    </section>

    <section class="rounded-2xl border border-zinc-800 p-6" style="background: rgba(24, 24, 27, 0.65); backdrop-filter: blur(12px);">
      <h2 class="text-xl font-semibold">Contract sections</h2>
      <p class="mt-2 text-zinc-300">Goal, Scope, Triggers, Inputs, Invariants, Procedure, Outputs, Review gate, and References are defined in <code>SKILL.md</code>.</p>
    </section>
  </main>
</body>
</html>
